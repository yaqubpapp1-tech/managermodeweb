 'Raphinha':'cards/233419_en-GB.webp','Harry Kane':'cards/202126_en-GB.webp','Ewa Pajor':'cards/241846_en-GB.webp','Gianluigi Donnarumma':'cards/230621_en-GB.webp',
 'Thibaut Courtois':'cards/192119_en-GB.webp','Lionel Messi':'cards/158023_en-GB.webp','Bruno Fernandes':'cards/212198_en-GB.webp','Khadija Shaw':'cards/246219_en-GB.webp',

};
const positions=['GK','LB','CB','RB','CDM','CM','CAM','LM','RM','LW','RW','ST'];
const navItems=[['dashboard','⌂','Dashboard'],['squad','♟','Squad'],['registration','☑','Registration'],['transfers','⇄','Transfers'],['calendar','▣','Calendar'],['league','♜','League'],['ucl','★','UCL'],['stats','◒','Stats']];
let page='dashboard';
let manager={name:'',age:'',club:''};
let setupStep=1;
let careerStarted=false;
let clubs=['Barcelona','Real Madrid','Manchester City','Liverpool','Arsenal','Bayern Munich','Paris Saint-Germain','Inter','AC Milan','Juventus','Chelsea','Atlético Madrid'];
let lineup=[players[3],players[24],players[31],players[34],players[38],players[6],players[4],players[9],players[5],players[23],players[1]];
let lineupPos=['GK','LB','CB','RB','CDM','CM','CM','CAM','LW','RW','ST'];
let bench=[players[28],players[50],players[54],players[56],players[61],players[72],players[79]];
let registered=[...lineup,...bench];
let footballStyle='Balanced';
const footballStyles={
 'High Press':{desc:'Aggressive pressing and quick pressure after losing the ball. Players burn energy quickly and will need frequent substitutions.',chips:['Very high intensity','Fast fatigue','Frequent subs'],stats:[['Intensity','Very High'],['Passing','Direct'],['Defence','Aggressive'],['Fatigue','High']]},
 'Balanced':{desc:'A bit of everything. Keeps the team adaptable without heavily sacrificing energy, possession, or defensive shape.',chips:['All-round','Medium intensity','Flexible'],stats:[['Intensity','Medium'],['Passing','Mixed'],['Defence','Balanced'],['Fatigue','Medium']]},
 'Passing Game':{desc:'Short passing build-up focused on keeping the ball, creating triangles, and patiently moving the opposition around.',chips:['Short passing','Possession','Patient build-up'],stats:[['Intensity','Medium'],['Passing','Short'],['Defence','Shape'],['Fatigue','Low']]},
 'Haramball':{desc:'Total defence. Sit deep, protect the box, and make the opposition break you down before looking for chances.',chips:['Total defence','Deep block','Counter focus'],stats:[['Intensity','Low'],['Passing','Direct'],['Defence','Very High'],['Fatigue','Low']]}
};
function imgFor(p){return imageMap[p[0]]||placeholder}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function positionRating(p,pos){const base=p[2], pref=p[1]; if(p[0]==='Lamine Yamal'&&pos==='CB')return 41; if(pos===pref)return base;
 const groups={GK:['GK'],DEF:['LB','CB','RB'],MID:['CDM','CM','CAM','LM','RM'],ATT:['LW','RW','ST']};
 const group=k=>Object.keys(groups).find(g=>groups[g].includes(k)); const a=group(pref),b=group(pos);
 if(a===b)return Math.max(1,base-3); if((a==='MID'&&b==='ATT')||(a==='ATT'&&b==='MID'))return Math.max(1,base-8); if((a==='DEF'&&b==='MID')||(a==='MID'&&b==='DEF'))return Math.max(1,base-18); if((a==='ATT'&&b==='DEF')||(a==='DEF'&&b==='ATT'))return Math.max(1,base-30); return Math.max(1,base-42);
}
function nav(){document.getElementById('nav').innerHTML=navItems.map(x=>`<button class="${page===x[0]?'active':''}" onclick="go('${x[0]}')"><span class="icon">${x[1]}</span>${x[2]}</button>`).join('')}
function shell(title,sub,content){document.getElementById('main').innerHTML=`<div class="topbar"><div><div class="eyebrow">Manager Career Mode</div><div class="title">${title}</div><div class="sub">${sub}</div></div><div class="season"><span class="pill">Season 2026/27</span><span class="pill">${esc(manager.club||'Club')}</span><span class="pill">${esc(manager.name||'Manager')}</span></div></div>${content}`;nav()}
function go(p){page=p;({dashboard:dashboard,squad:squad,registration:registration,transfers:transfers,calendar:calendar,league:league,ucl:ucl,stats:stats}[p]||dashboard)()}
function setup(){
 document.getElementById('nav').innerHTML='';
 const step=setupStep;
 document.getElementById('main').innerHTML=`<div class="setup-wrap"><div class="setup-card"><div class="eyebrow">Manager Career Mode</div><div class="setup-title">Start your career</div><div class="sub">${step===1?'Tell us who you are before choosing your club.':'Choose your club carefully — once selected, it is locked for this career.'}</div>${step===1?`<form onsubmit="event.preventDefault();startSetup()"><label>Manager name<input id="managerName" required maxlength=28 placeholder="e.g. Alex Smith" value="${esc(manager.name)}"></label><label>Age<input id="managerAge" type="number" min=16 max=90 required placeholder="18" value="${esc(String(manager.age))}"></label><button class="btn primary setup-btn">Continue to club selection →</button></form>`:`<div class="club-grid">${clubs.map(c=>`<button class="club-choice ${manager.club===c?'selected':''}" ${careerStarted?'disabled':''} onclick="selectClub('${esc(c)}')"><span>${c.slice(0,2).toUpperCase()}</span><b>${c}</b><small>${manager.club===c?'Selected':'Choose club'}</small></button>`).join('')}</div><div class="setup-note">Club selection is permanent for this save.</div>`}</div></div>`;
}
function startSetup(){manager.name=document.getElementById('managerName').value.trim();manager.age=document.getElementById('managerAge').value;setupStep=2;setup()}
function selectClub(club){if(careerStarted)return;manager.club=club;careerStarted=true;localStorage.setItem('managercareerweb_setup',JSON.stringify({manager,careerStarted}));page='dashboard';dashboard();toast(club+' selected — club locked')}
function ensureCareer(){if(!careerStarted){setup();return false}return true}
function dashboard(){shell('Manager Career','Build your club, manage the squad and chase trophies.',`<div class="grid cards4"><div class="panel metric"><div class="label">Club Balance</div><div class="value">$82.4M</div><div class="small positive">+ $4.8M this week</div></div><div class="panel metric"><div class="label">Squad OVR</div><div class="value">${Math.round(lineup.reduce((a,p,i)=>a+positionRating(p,lineupPos[i]),0)/lineup.length)}</div><div class="small">Best XI average</div></div><div class="panel metric"><div class="label">League Position</div><div class="value gold">1st</div><div class="small">0 matches played</div></div><div class="panel metric"><div class="label">Board Confidence</div><div class="value positive">92%</div><div class="small">Excellent</div></div></div><div class="grid cards3" style="margin-top:16px"><div class="panel"><div class="sectionhead"><h2>Next Match</h2><span class="pill">Friendly</span></div><div style="font-size:22px;font-weight:800;margin:20px 0 6px">${esc(manager.club||'Your Club')} <span class="small">vs</span> Riverton FC</div><div class="small">Saturday · 15:00 · Home</div><button class="btn primary" style="margin-top:18px" onclick="go('squad')">Set Lineup</button></div><div class="panel"><div class="sectionhead"><h2>Manager Inbox</h2><span class="small">3 new</span></div><p class="small">Scouts have shortlisted 4 players. The board expects a top-four finish this season.</p><p class="small">Your assistant recommends keeping the current 4-3-3.</p></div><div class="panel"><div class="sectionhead"><h2>Quick Start</h2></div><div style="display:grid;gap:8px"><button class="btn" onclick="go('squad')">⚽ Manage Squad</button><button class="btn" onclick="go('transfers')">↔ Open Transfer Hub</button><button class="btn" onclick="go('calendar')">▣ View Calendar</button></div></div></div>`)}
let selectedIndex=0;
function shortName(name){return name.replace('Alexia Putellas','Alexia').replace('Federico Valverde','Valverde').replace('Marc-André ter Stegen','ter Stegen').replace('Kylian Mbappé','Mbappé').replace('Caroline Graham Hansen','Graham Hansen').replace('Gianluigi Donnarumma','Donnarumma').replace('Thibaut Courtois','Courtois');}
function playerDot(p,pos,i){
 const xs=[50,20,40,60,80,30,50,70,18,82,50], ys=[89,71,68,68,71,51,51,51,30,30,17];
 return `<div class="fc-player ${selectedIndex===i?'selected':''}" style="left:${xs[i]}%;top:${ys[i]}%" onclick="moveOrSelect(${i})">
 <div class="avatar"><img src="${imgFor(p)}" onerror="this.src='${placeholder}'"><span class="mini-ovr">${positionRating(p,pos)}</span><span class="mini-pos">${pos}</span></div>
 <div class="name">${esc(shortName(p[0]))}</div><div class="condition">● ${i===0?'100%':i%3===0?'95%':'98%'}</div></div>`;
}
function subCard(p){
 return `<div class="sub-card" onclick="selectBench('${esc(p[0])}')"><img src="${imgFor(p)}" onerror="this.src='${placeholder}'"><div class="sub-name">${esc(shortName(p[0]))}</div><div class="sub-meta">${p[1]} · <span class="sub-ovr">${p[2]}</span></div></div>`;
}
let moveIndex=null;
function moveOrSelect(i){if(moveIndex===null){moveIndex=i;selectedIndex=i;squad();return}if(moveIndex===i){moveIndex=null;selectedIndex=i;squad();return}[lineup[moveIndex],lineup[i]]=[lineup[i],lineup[moveIndex]];selectedIndex=i;moveIndex=null;squad();toast('Player moved — position is set by the pitch slot')}
function selectPlayer(i){selectedIndex=i;moveIndex=null;squad()}
function selectBench(name){const i=players.findIndex(p=>p[0]===name);if(i>=0)toast(name+' selected')}
function changeSelectedPosition(pos){lineupPos[selectedIndex]=pos;squad()}
function playerDetail(p,pos){
 const o=positionRating(p,pos);
 return `<div class="injury">⚠ Injury Type: Pulled Groin · Available to Play in 21 days</div>
 <div class="detail-head"><div class="detail-card"><img src="${imgFor(p)}" onerror="this.src='${placeholder}'"></div><div><div class="detail-rating">${o}<span style="font-size:10px;color:#8f9bc7"> OVR</span></div><div class="detail-name">${esc(p[0])}</div><div class="detail-sub">● ${p[1]} · Playing ${pos}</div></div></div>
 <div class="detail-section">Player Info</div><div class="detail-grid">
 ${[['Energy','100%'],['Sharpness','90'],['Morale','Happy'],['Foot','Right'],['Acceleration','Fast'],['Length','Average'],['Role','Squad Player'],['Speed',String(Math.min(99,Math.max(55,o-4)))],['Diving',p[1]==='GK'?'86':'—'],['Handling',p[1]==='GK'?'85':'—'],['Kicking',p[1]==='GK'?'85':'—'],['Reflexes',p[1]==='GK'?'89':'—']].map(x=>`<div class="detail-stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>
 <div class="detail-section">Position</div><select class="search" onchange="changeSelectedPosition(this.value)">${positions.map(x=>`<option ${x===pos?'selected':''}>${x}</option>`).join('')}</select>
 <div class="detail-section">PlayStyles</div><div class="playstyles"><div class="style-dot">◆</div><div class="style-dot">◈</div><div class="style-dot">✦</div><div class="style-dot">◇</div><div class="style-dot">◇</div></div>`;
}
function tacticsTabs(active){return `<div class="tactics-tabs"><button class="${active==='squad'?'active':''}" onclick="squad()">Squad</button><button class="${active==='tactics'?'active':''}" onclick="tactics()">Tactics</button><button class="${active==='assignments'?'active':''}" onclick="toast('Assignments are coming soon')">Assignments</button></div>`}
function chooseFootballStyle(style){footballStyle=style;tactics()}
function tactics(){
 const current=footballStyles[footballStyle];
 const cards=Object.entries(footballStyles).map(([name,data])=>`<button class="tactic-option ${name===footballStyle?'active':''}" onclick="chooseFootballStyle('${name}')"><span class="check">✓</span><div class="tactic-name">${name}</div><div class="tactic-desc">${data.desc}</div><div class="tactic-impact">${data.chips.map(c=>`<span class="impact">${c}</span>`).join('')}</div></button>`).join('');
 shell('Team Management','Squad  ·  Tactics  ·  Assignments',`${tacticsTabs('tactics')}<div class="panel"><div class="tactic-current"><div><div class="small">Current football style</div><b>${footballStyle}</b><div class="tactic-note">${current.desc}</div></div><span class="pill">Active</span></div><div class="tactic-choice">${cards}</div><div class="tactic-preview">${current.stats.map(x=>`<div class="preview-stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div>`);
}
function squad(){
 const p=lineup[selectedIndex]||lineup[0], pos=lineupPos[selectedIndex]||p[1];
 const pitch=`<div class="fc-pitch"><div class="pitch-circle"></div><div class="pitch-box top"></div><div class="pitch-box bottom"></div><div class="pitch-goal top"></div><div class="pitch-goal bottom"></div>${lineup.map((p,i)=>playerDot(p,lineupPos[i],i)).join('')}</div>`;
 const subs=`<div class="subs-panel"><div class="subs-title">Substitutes</div><div class="subs-row">${bench.map(subCard).join('')}</div></div>`;
 shell('Team Management','Squad  ·  Tactics  ·  Assignments',`${tacticsTabs('squad')}<div class="squad-screen"><div>${pitch}${subs}<div class="fc-footer"><span>◉ Back</span><span onclick="tactics()" style="cursor:pointer">✎ Edit Active Tactic</span><span>◉ Suggested Subs</span><span>↔ Quick Subs</span><span>⚙ Tutorials</span></div></div><aside class="squad-side">${playerDetail(p,pos)}</aside></div>`);
}
function registration(){
 if(!ensureCareer())return;
 const available=players.filter(p=>!registered.some(r=>r[0]===p[0]&&r[1]===p[1]&&r[2]===p[2])).slice(0,12);
 shell('Registration','Register a maximum of 25 players for your season.',`<div class="grid cards3"><div class="panel" style="grid-column:span 2"><div class="sectionhead"><h2>Registered Squad</h2><span class="pill">${registered.length}/25</span></div><div class="reg-list">${registered.map((p,i)=>`<div class="reg-row"><img src="${imgFor(p)}" onerror="this.src='${placeholder}'"><div><b>${esc(p[0])}</b><span>${p[1]} · ${p[2]} OVR</span></div><button class="btn" onclick="removeRegistered(${i})" ${registered.length<=11?'disabled':''}>Remove</button></div>`).join('')}</div></div><div class="panel"><div class="sectionhead"><h2>Available</h2><span class="small">Showing a shortlist</span></div>${available.map(p=>`<div class="reg-row compact"><img src="${imgFor(p)}" onerror="this.src='${placeholder}'"><div><b>${esc(p[0])}</b><span>${p[1]} · ${p[2]}</span></div><button class="btn primary" onclick="addRegistered('${esc(p[0])}')" ${registered.length>=25?'disabled':''}>Add</button></div>`).join('')}</div></div>`)
}
function addRegistered(name){if(registered.length>=25){toast('Registration limit reached: 25 players');return}const p=players.find(x=>x[0]===name);if(p&&!registered.includes(p)){registered.push(p);registration()}}
function removeRegistered(i){const p=registered[i];if(lineup.includes(p)||bench.includes(p)){toast('Move this player out of the match squad first');return}if(registered.length<=11){toast('Keep at least 11 registered players');return}registered.splice(i,1);registration()}
function ucl(){if(!ensureCareer())return;const teams=[manager.club||'Your Club',...['Real Madrid','Manchester City','Bayern Munich','Paris Saint-Germain','Inter','Arsenal','Liverpool'].filter(x=>x!==(manager.club||'Your Club'))];shell('UCL Campaign','Champions League group-stage campaign and knockout path.',`<div class="grid cards3"><div class="panel"><div class="sectionhead"><h2>Group Stage</h2><span class="pill">Group A</span></div><table class="table"><tr><th>#</th><th>Club</th><th>P</th><th>Pts</th></tr>${teams.slice(0,4).map((t,i)=>`<tr><td class="rank">${i+1}</td><td><b>${esc(t)}</b></td><td>0</td><td>0</td></tr>`).join('')}</table></div><div class="panel"><div class="sectionhead"><h2>Campaign</h2><span class="pill">Not started</span></div><div class="ucl-stage"><b>Group Stage</b><span>● ● ● ● ● ●</span></div><div class="ucl-stage"><b>Round of 16</b><span>Locked</span></div><div class="ucl-stage"><b>Quarter-final</b><span>Locked</span></div><div class="ucl-stage"><b>Semi-final</b><span>Locked</span></div><div class="ucl-stage"><b>Final</b><span>Locked</span></div></div><div class="panel"><div class="sectionhead"><h2>UCL Fixtures</h2></div><div class="fixture"><b>${esc(manager.club)}</b><span>vs</span><b>Real Madrid</b><small>Matchday 1 · Home</small></div><div class="fixture"><b>Manchester City</b><span>vs</span><b>${esc(manager.club)}</b><small>Matchday 2 · Away</small></div><div class="fixture"><b>${esc(manager.club)}</b><span>vs</span><b>Inter</b><small>Matchday 3 · Home</small></div></div></div>`)}
function transfers(){shell('Transfer Hub','Scout targets, negotiate deals and improve the squad.',`<div class="grid cards3"><div class="panel"><div class="sectionhead"><h2>Shortlist</h2><span class="pill">4 targets</span></div><table class="table"><tr><th>Player</th><th>Pos</th><th>OVR</th><th>Value</th></tr>${players.slice(0,4).map(p=>`<tr><td><b>${esc(p[0])}</b></td><td>${p[1]}</td><td>${p[2]}</td><td>$${(p[2]*1.1).toFixed(1)}M</td></tr>`).join('')}</table></div><div class="panel"><div class="sectionhead"><h2>Outgoing</h2></div><div class="empty">No players listed for transfer.</div><button class="btn" onclick="toast('Transfer list opened')">Manage Transfer List</button></div><div class="panel"><div class="sectionhead"><h2>Scout Network</h2></div><p class="small">Europe · South America · North America</p><div class="metric"><div class="value">24</div><div class="small">reports ready</div></div><button class="btn primary" onclick="toast('Scouting reports refreshed')">Refresh Reports</button></div></div>`)}
function calendar(){shell('Calendar','Fixtures, training and key club dates.',`<div class="panel"><div class="sectionhead"><h2>August 2026</h2><span class="small">Pre-season</span></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="day" style="min-height:auto;font-weight:800;color:#8fa0ad">${d}</div>`).join('')}${Array.from({length:31},(_,i)=>`<div class="day"><div class="date">${i+1}</div>${i===6?'<div class="match">Manager XI vs Riverton</div><div class="tag">FRIENDLY</div>':''}${i===13?'<div class="match">League opener</div><div class="tag">HOME</div>':''}</div>`).join('')}</div></div>`)}
function league(){const table=[manager.club||'Your Club','Northbridge','Riverton FC','Kingsport','Westlake','Harbor City','Redwood','Easton'];shell('League','Track the table, form and title race.',`<div class="panel"><div class="sectionhead"><h2>League Table</h2><span class="pill">Matchday 0</span></div><table class="table"><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>Pts</th></tr>${table.map((club,i)=>`<tr><td class="rank">${i+1}</td><td><b>${esc(club)}</b></td><td>0</td><td>0</td><td>0</td><td>0</td><td><b>0</b></td></tr>`).join('')}</table></div>`)}
function stats(){shell('Stats','Squad ratings and manager performance.',`<div class="grid cards3"><div class="panel"><div class="sectionhead"><h2>Top Rated</h2></div>${players.slice(0,10).map((p,i)=>`<div class="player-row" style="grid-template-columns:25px 1fr auto"><span class="rank">${i+1}</span><div><b>${esc(p[0])}</b><span>${p[1]}</span></div><div class="rating">${p[2]}</div></div>`).join('')}</div><div class="panel"><div class="sectionhead"><h2>Squad Breakdown</h2></div><div style="font-size:13px;line-height:2.2">Goalkeepers <b style="float:right">${players.filter(p=>p[1]==='GK').length}</b><br>Defenders <b style="float:right">${players.filter(p=>['LB','CB','RB'].includes(p[1])).length}</b><br>Midfielders <b style="float:right">${players.filter(p=>['CDM','CM','CAM','LM','RM'].includes(p[1])).length}</b><br>Attackers <b style="float:right">${players.filter(p=>['LW','RW','ST'].includes(p[1])).length}</b></div></div><div class="panel"><div class="sectionhead"><h2>Manager Record</h2></div><div class="metric"><div class="label">Matches</div><div class="value">0</div><div class="small">No matches played yet</div></div><div class="metric"><div class="label">Win Rate</div><div class="value positive">—</div></div></div></div>`)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>t.style.display='none',1800)}
function saveGame(){localStorage.setItem('managercareerweb',JSON.stringify({lineup,lineupPos,bench,registered,page,manager,careerStarted,footballStyle}));toast('Career saved locally')}
function loadGame(){try{const x=JSON.parse(localStorage.getItem('managercareerweb'));if(x){lineup=x.lineup||lineup;lineupPos=x.lineupPos||lineupPos;bench=x.bench||bench;registered=x.registered||[...lineup,...bench];manager=x.manager||manager;careerStarted=!!x.careerStarted;footballStyle=x.footballStyle||footballStyle}}catch(e){}if(!careerStarted){setup();}else go(page)}

</script>
